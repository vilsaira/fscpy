name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install '.[voxel,paths,test]'
      - run: python -m pytest -q
      - run: python examples/parcellation.py
      - run: python examples/voxel.py
