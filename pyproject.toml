[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fscpy"
version = "2.0.0"
description = "Function-structure coupling on parcellation and FOD-derived voxel graphs"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Viljami Sairanen"}]
license = {file = "LICENSE"}
dependencies = ["numpy>=1.24", "scipy>=1.12"]

[project.optional-dependencies]
voxel = ["nibabel>=5.2", "dipy>=1.10"]
paths = ["networkx>=3.2"]
test = ["pytest>=8"]

[project.urls]
Repository = "https://github.com/vilsaira/fscpy"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
